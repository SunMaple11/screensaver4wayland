name: Test and package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-cairo python3-gi-cairo python3-pil \
            gir1.2-gtk-3.0 gsettings-desktop-schemas librsvg2-common \
            dpkg xz-utils desktop-file-utils
      - run: /usr/bin/python3 -m unittest discover -s tests -v
      - run: /usr/bin/python3 scripts/build_release.py --output-dir dist
      - run: /usr/bin/python3 scripts/check_release.py --directory dist
