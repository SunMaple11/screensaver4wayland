name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-cairo python3-gi-cairo python3-pil \
            gir1.2-gtk-3.0 gsettings-desktop-schemas librsvg2-common \
            dpkg xz-utils desktop-file-utils

      - name: Test
        run: /usr/bin/python3 -m unittest discover -s tests -v

      - name: Build release files
        run: |
          /usr/bin/python3 scripts/build_release.py --output-dir dist \
            --expect-tag "$GITHUB_REF_NAME" \
            --homepage "https://github.com/$GITHUB_REPOSITORY"
          /usr/bin/python3 scripts/check_release.py --directory dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "screensaver4wayland $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md
